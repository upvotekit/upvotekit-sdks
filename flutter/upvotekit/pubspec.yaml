name: upvotekit
description: >
  First-party Flutter SDK for UpvoteKit — a thin webview wrapper around the
  hosted embed pages for feedback boards, roadmaps, and changelogs.
version: 0.2.0
homepage: https://upvotekit.com
repository: https://github.com/upvotekit/upvotekit-sdks/tree/main/flutter/upvotekit
issue_tracker: https://github.com/upvotekit/upvotekit-sdks/issues
topics:
  - feedback
  - webview
  - roadmap
  - changelog
  - widget

environment:
  sdk: ^3.13.3
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
